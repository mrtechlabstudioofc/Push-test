<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউজার ড্যাশবোর্ড - MR Techlab Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #4285F4; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
        button:hover { background: #357ae8; }
        .box { border: 1px solid #ddd; padding: 15px; margin-top: 20px; border-radius: 5px; background: #fafafa; }
        .logout-btn { background: #db4437; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ইউজার প্যানেল</h2>
        
        <!-- লগইন সেকশন -->
        <div id="auth-section">
            <h3>লগইন করুন</h3>
            <input type="email" id="loginEmail" placeholder="আপনার ইমেইল দিন">
            <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড দিন">
            <button id="login-btn">লগইন করুন</button>
        </div>
        
        <!-- লগইন করার পর ইউজার ইনফো -->
        <div id="user-info" style="display:none;">
            <p>স্বাগতম, <span id="user-email-display"></span></p>
            <button id="logout-btn" class="logout-btn">লগআউট</button>
        </div>

        <div class="box">
            <h4>ইন-অ্যাপ নোটিফিকেশন:</h4>
            <div id="notification-box">কোনো নতুন নোটিফিকেশন নেই।</div>
        </div>
    </div>

    <!-- Firebase SDK (Modular Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        /* ==========================================================
           ⚠️ আপনার ফায়ারবেস প্রজেক্টের আসল কনফিগারেশন ⚠️
           ========================================================== */
        const firebaseConfig = {
            apiKey: "AIzaSyBQXDEFuilbYDsry-ktqWylIzqgPZNbUWQ",
            authDomain: "mr-techlabe.firebaseapp.com",
            databaseURL: "https://mr-techlabe-default-rtdb.firebaseio.com",
            projectId: "mr-techlabe",
            storageBucket: "mr-techlabe.firebasestorage.app",
            messagingSenderId: "172436004844",
            appId: "1:172436004844:web:466012505fa13297eb2ac9",
            measurementId: "G-E64JT771TM"
        };

        // ফায়ারবেস ইনিশিয়ালাইজ
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ইমেইল ও পাসওয়ার্ড দিয়ে লগইন হ্যান্ডেল
        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                alert("দয়া করে ইমেইল এবং পাসওয়ার্ড উভয়ই দিন!");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("সফলভাবে লগইন হয়েছে!");
                })
                .catch((error) => {
                    alert("লগইন ব্যর্থ হয়েছে: " + error.message);
                });
        });

        // লগআউট বাটন হ্যান্ডেল
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // ইউজারের অথ স্টেট চেক করা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-info').style.display = 'block';
                document.getElementById('user-email-display').innerText = user.email;

                // ডাটাবেস থেকে ইউজারের নোটিফিকেশন রিড করা (ডট রিমুভ করে কি তৈরি করা হয়েছে)
                const sanitizedEmail = user.email.replace(/\./g, '_');
                const notificationRef = ref(db, 'notifications/' + sanitizedEmail);

                onValue(notificationRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('notification-box').innerHTML = 
                            `<strong>${data.title}</strong><p>${data.message}</p><small>${new Date(data.timestamp).toLocaleString()}</small>`;
                        
                        alert("নতুন নোটিফিকেশন এসেছে: " + data.title);
                    }
                });

            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('user-info').style.display = 'none';
                document.getElementById('notification-box').innerHTML = "লগইন করুন নোটিফিকেশন দেখার জন্য।";
            }
        });
    </script>
</body>
</html>
