<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - MR Techlab Studio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #34A853; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
        button:hover { background: #2e8b57; }
        .logout-btn { background: #db4437; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>অ্যাডমিন নোটিফিকেশন প্যানেল</h2>
        
        <!-- অ্যাডমিন লগইন সেকশন -->
        <div id="auth-section">
            <h3>অ্যাডমিন লগইন</h3>
            <input type="email" id="adminEmail" placeholder="অ্যাডমিন ইমেইল দিন">
            <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন">
            <button id="login-btn">অ্যাডমিন লগইন</button>
        </div>
        
        <!-- অ্যাডমিন প্যানেল ড্যাশবোর্ড -->
        <div id="admin-panel" style="display:none;">
            <p>লগইনকৃত অ্যাডমিন: <span id="admin-email-display"></span></p>
            <hr>
            
            <label>ইউজারের ইমেইল (যার কাছে পাঠাবেন):</label>
            <input type="email" id="targetUserEmail" placeholder="user@gmail.com">

            <label>নোটিফিকেশনের শিরোনাম:</label>
            <input type="text" id="notiTitle" placeholder="যেমন: আপডেট নোটিশ">

            <label>বিস্তারিত বার্তা:</label>
            <textarea id="notiMessage" rows="4" placeholder="আপনার বার্তা এখানে লিখুন..."></textarea>

            <button onclick="sendNotificationToUser()">ইউজারকে নোটিফিকেশন পাঠান</button>
            <button id="logout-btn" class="logout-btn">লগআউট</button>
        </div>
    </div>

    <!-- Firebase SDK (Modular Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        /* ==========================================================
           ⚠️ আপনার ফায়ারবেস প্রজেক্টের আসল কনফিগারেশন ⚠️
           ========================================================== */
        const firebaseConfig = {
            apiKey: "AIzaSyBQXDEFuilbYDsry-ktqWylIzqgPZNbUWQ",
            authDomain: "mr-techlabe.firebaseapp.com",
            databaseURL: "https://mr-techlabe-default-rtdb.firebaseio.com",
            projectId: "mr-techlabe",
            storageBucket: "mr-techlabe.firebasestorage.app",
            messagingSenderId: "172436004844",
            appId: "1:172436004844:web:466012505fa13297eb2ac9",
            measurementId: "G-E64JT771TM"
        };

        // ফায়ারবেস ইনিশিয়ালাইজ
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // অ্যাডমিন লগইন হ্যান্ডেল
        document.getElementById('login-btn').addEventListener('click', () => {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            if (!email || !password) {
                alert("দয়া করে ইমেইল এবং পাসওয়ার্ড দিন!");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    alert("অ্যাডমিন সফলভাবে লগইন হয়েছে!");
                })
                .catch((error) => {
                    alert("লগইন ব্যর্থ হয়েছে: " + error.message);
                });
        });

        // লগআউট হ্যান্ডেল
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // অথ স্টেট মনিটর
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('admin-email-display').innerText = user.email;
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
            }
        });

        /* ==========================================================
           ⚠️ নোটিফিকেশন ডাটাবেসে পাঠানোর ফাংশন ⚠️
           ========================================================== */
        window.sendNotificationToUser = function() {
            const rawEmail = document.getElementById('targetUserEmail').value.trim();
            const title = document.getElementById('notiTitle').value.trim();
            const message = document.getElementById('notiMessage').value.trim();

            if (!rawEmail || !title || !message) {
                alert("দয়া করে সব ফিল্ড সঠিকভাবে পূরণ করুন!");
                return;
            }

            // ডাটাবেস পাথের জন্য ইমেইলের ডট রিমুভ করে আন্ডারস্কোর দেওয়া
            const targetUserKey = rawEmail.replace(/\./g, '_');

            // রিয়েল-টাইম ডাটাবেসে নোটিফিকেশন সেভ করা
            set(ref(db, 'notifications/' + targetUserKey), {
                title: title,
                message: message,
                timestamp: Date.now()
            }).then(() => {
                alert("সফলভাবে ইউজারের কাছে নোটিফিকেশন পাঠানো হয়েছে!");
                document.getElementById('targetUserEmail').value = '';
                document.getElementById('notiTitle').value = '';
                document.getElementById('notiMessage').value = '';
            }).catch((error) => {
                alert("ত্রুটি ঘটেছে: " + error.message);
            });
        }
    </script>
</body>
</html>
